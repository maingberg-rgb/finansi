services:
  - type: web
    name: home-finance-app
    env: node
    buildCommand: "npm install --prefix server && npm install --prefix client && npm run build --prefix client && npm run postinstall --prefix server"
    startCommand: "npm start --prefix server"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
